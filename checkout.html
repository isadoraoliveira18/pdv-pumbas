<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pumba's Burguer - Checkout</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root{
      --laranja:#ff7b00;
      --laranja-claro:#ffae42;
      --fundo:#0e0e0e;
      --card:#171717;
      --card2:#101010;
      --texto:#ffffff;
      --cinza:#bdbdbd;
      --borda:rgba(255,123,0,.15);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:
      linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.88)),
      url("logo.png");

      background-size:600px;
      background-position:center;
      background-attachment:fixed;

      color:#fff;
      min-height:100vh;
    }

    /* ================= HEADER ================= */

    .cabecalho{
      width:100%;
      background:#000;
      border-bottom:3px solid var(--laranja);

      padding:20px;

      text-align:center;

      box-shadow:
      0 5px 20px rgba(255,123,0,.15);
    }

    .titulo-principal{
      font-family:'Bebas Neue',sans-serif;
      font-size:42px;
      letter-spacing:2px;
      color:var(--laranja);
    }

    .text-final{
      color:var(--laranja-claro);
      font-size:15px;
      margin-top:5px;
    }

    /* ================= LAYOUT ================= */

    .checkout-container{
      width:100%;
      max-width:1300px;

      margin:auto;

      display:flex;
      gap:28px;

      justify-content:center;
      align-items:flex-start;

      padding:40px 20px;
      flex-wrap:wrap;
    }

    .info-pedido,
    .resumo-pedido{
      flex:1;
      min-width:320px;
      max-width:520px;

      background:
      linear-gradient(180deg,var(--card),var(--card2));

      border:1px solid var(--borda);

      border-radius:22px;

      padding:24px;

      box-shadow:
      0 10px 30px rgba(0,0,0,.35);
    }

    h2{
      color:var(--laranja);
      margin-bottom:22px;
      font-size:22px;
      letter-spacing:1px;
    }

    /* ================= CAMPOS ================= */

    .campo{
      margin-bottom:18px;
    }

    .small{
      display:block;
      margin-bottom:7px;
      color:#ddd;
      font-size:14px;
    }

    input,
    select,
    textarea{
      width:100%;

      padding:14px;

      border:none;
      outline:none;

      border-radius:14px;

      background:#0d0d0d;

      color:#fff;

      font-size:15px;

      border:1px solid rgba(255,255,255,.06);

      transition:.25s;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:var(--laranja);

      box-shadow:
      0 0 0 3px rgba(255,123,0,.12);
    }

    textarea{
      resize:none;
      min-height:90px;
    }

    /* ================= PIX ================= */

    .pix-section{
      display:none;

      margin-top:15px;

      background:#111;

      border:1px dashed rgba(255,123,0,.25);

      border-radius:16px;

      padding:18px;
    }

    .pix-key-box label{
      display:block;
      color:var(--laranja-claro);
      margin-bottom:8px;
      font-size:13px;
    }

    .pix-key-box code{
      display:block;

      background:#000;

      padding:14px;

      border-radius:12px;

      border:1px solid rgba(255,123,0,.12);

      color:#fff;

      word-break:break-all;
    }

    .pix-actions{
      margin-top:15px;
    }

    .btn{
      border:none;
      cursor:pointer;

      padding:12px 18px;

      border-radius:12px;

      font-weight:600;

      transition:.25s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-pix{
      background:linear-gradient(90deg,var(--laranja),var(--laranja-claro));
      color:#fff;
      width:100%;
    }

    .copy-feedback{
      display:block;
      margin-top:10px;
      color:#00ff95;
      font-size:13px;
      opacity:0;
      transition:.25s;
    }

    .copy-feedback.show{
      opacity:1;
    }

    /* ================= RESUMO ================= */

    .resumo-topo{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:18px;
    }

    .pedido-count{
      background:rgba(255,123,0,.12);

      color:var(--laranja-claro);

      padding:7px 12px;

      border-radius:999px;

      font-size:13px;
      font-weight:600;
    }

    #listaCarrinho{
      list-style:none;
    }

    .item-carrinho{
      display:flex;
      justify-content:space-between;
      gap:14px;

      padding:14px;

      border-radius:16px;

      background:#111;

      margin-bottom:14px;

      border:1px solid rgba(255,255,255,.04);
    }

    .item-info{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .item-nome{
      font-weight:600;
      color:#fff;
    }

    .item-qtd{
      font-size:13px;
      color:#aaa;
    }

    .item-preco{
      color:var(--laranja-claro);
      font-weight:700;
      white-space:nowrap;
    }

    .linha-entrega{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.05);

      display:flex;
      justify-content:space-between;

      color:#ccc;
    }

    .total-box{
      margin-top:24px;

      background:#111;

      border-radius:18px;

      padding:18px;

      border:1px solid rgba(255,123,0,.12);
    }

    .total-linha{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .total-linha strong{
      color:var(--laranja);
      font-size:28px;
    }

    /* ================= BOTÃO FINALIZAR ================= */

    .btn-finalizar{
      width:100%;
      margin-top:24px;

      padding:16px;

      border:none;

      border-radius:16px;

      background:
      linear-gradient(90deg,var(--laranja),var(--laranja-claro));

      color:#fff;

      font-size:16px;
      font-weight:700;

      cursor:pointer;

      transition:.25s;
    }

    .btn-finalizar:hover{
      transform:translateY(-3px);
      box-shadow:
      0 10px 25px rgba(255,123,0,.22);
    }

    .vazio{
      text-align:center;
      color:#aaa;
      padding:30px 10px;
    }

    /* ================= RESPONSIVO ================= */

    @media(max-width:900px){

      .checkout-container{
        padding:20px 14px 40px;
      }

      .titulo-principal{
        font-size:34px;
      }

      .info-pedido,
      .resumo-pedido{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <header class="cabecalho">

    <h1 class="titulo-principal">
      Pumba's Burguer
    </h1>

    <p class="text-final">
      Finalize seu pedido
    </p>

  </header>

  <main class="checkout-container">

    <!-- ================= ESQUERDA ================= -->

    <section class="info-pedido">

      <h2>📋 Informações do Pedido</h2>

      <div class="campo">
        <label class="small">Seu nome</label>

        <input
          type="text"
          id="nomeCliente"
          placeholder="Digite seu nome"
        >
      </div>

      <div class="campo">

        <label class="small">
          Tipo de entrega
        </label>

        <select id="tipoEntrega" onchange="mostrarOpcoesEntrega()">

          <option value="retirada">
            Retirada no local
          </option>

          <option value="entrega">
            Entrega
          </option>

        </select>
      </div>

      <div
        id="opcoesEntregaBox"
        class="campo"
        style="display:none;"
      >

        <label class="small">
          Região
        </label>

        <select
          id="localEntrega"
          onchange="mostrarEnderecoEntrega()"
        >

          <option value="pumba">
            Pumba - R$2
          </option>

          <option value="lisboa">
            Lisboa - R$3
          </option>

          <option value="touquinha">
            Toquinha/Gremio - R$7
          </option>

          <option value="bocadamata">
            Boca da Mata - R$9
          </option>

          <option value="outro">
            Outro endereço
          </option>

        </select>

      </div>

      <div
        id="enderecoBox"
        class="campo"
        style="display:none;"
      >

        <label class="small">
          Endereço
        </label>

        <input
          type="text"
          id="endereco"
          placeholder="Rua, número, bairro..."
        >

      </div>

      <div class="campo">

        <label class="small">
          Observações
        </label>

        <textarea
          id="observacao"
          placeholder="Ex: sem cebola..."
        ></textarea>

      </div>

      <div class="campo">

        <label class="small">
          Forma de pagamento
        </label>

        <select id="pagamentoSelect">

          <option value="dinheiro">
            Dinheiro
          </option>

          <option value="cartao">
            Cartão
          </option>

          <option value="pix">
            PIX
          </option>

        </select>

      </div>

      <!-- PIX -->

      <div id="pix-section" class="pix-section">

        <div class="pix-key-box">

          <label>
            Chave PIX
          </label>

          <code id="pixKeyText">
            75982183914
          </code>

        </div>

        <div class="pix-actions">

          <button
            id="copyPixBtn"
            class="btn btn-pix"
          >

            Copiar chave PIX

          </button>

          <span
            id="copyFeedback"
            class="copy-feedback"
          >

            Chave copiada!

          </span>

        </div>

      </div>

      <button
        id="btnEnviarWhats"
        class="btn-finalizar"
      >

        Enviar Pedido no WhatsApp

      </button>

    </section>

    <!-- ================= DIREITA ================= -->

    <aside class="resumo-pedido">

      <div class="resumo-topo">

        <h2>🛒 Seu Pedido</h2>

        <span class="pedido-count" id="pedidoCount">
          0 itens
        </span>

      </div>

      <ul id="listaCarrinho"></ul>

      <div class="total-box">

        <div class="total-linha">

          <span>Total</span>

          <strong id="totalResumo">
            R$ 0,00
          </strong>

        </div>

      </div>

    </aside>

  </main>

  <script>

    const PIX_KEY = "75982183914";
    const whatsNumber = "5575982183914";

    /* ================= CARRINHO ================= */

    const carrinho =
      JSON.parse(localStorage.getItem("carrinho")) || [];

    /* ================= MOSTRAR ENTREGA ================= */

    function mostrarOpcoesEntrega(){

      const tipo =
        document.getElementById("tipoEntrega").value;

      const box =
        document.getElementById("opcoesEntregaBox");

      const endereco =
        document.getElementById("enderecoBox");

      if(tipo === "entrega"){

        box.style.display = "block";

      }else{

        box.style.display = "none";
        endereco.style.display = "none";

      }

      exibirCarrinho();
    }

    function mostrarEnderecoEntrega(){

      const local =
        document.getElementById("localEntrega").value;

      document.getElementById("enderecoBox").style.display =
        local === "outro"
        ? "block"
        : "none";

      exibirCarrinho();
    }

    /* ================= PIX ================= */

    document
      .getElementById("pagamentoSelect")
      .addEventListener("change", e => {

        document.getElementById("pix-section").style.display =
          e.target.value === "pix"
          ? "block"
          : "none";

      });

    document
      .getElementById("copyPixBtn")
      .addEventListener("click", async () => {

        await navigator.clipboard.writeText(PIX_KEY);

        const feedback =
          document.getElementById("copyFeedback");

        feedback.classList.add("show");

        setTimeout(() => {

          feedback.classList.remove("show");

        }, 1500);

      });

    /* ================= VALOR ENTREGA ================= */

    function obterValorEntrega(local){

      switch(local){

        case "pumba":
          return 2;

        case "lisboa":
          return 3;

        case "touquinha":
          return 7;

        case "bocadamata":
          return 9;

        default:
          return 0;
      }
    }

    /* ================= EXIBIR CARRINHO ================= */

    function exibirCarrinho(){

      const lista =
        document.getElementById("listaCarrinho");

      const totalResumo =
        document.getElementById("totalResumo");

      const pedidoCount =
        document.getElementById("pedidoCount");

      lista.innerHTML = "";

      if(carrinho.length === 0){

        lista.innerHTML = `
          <div class="vazio">
            Nenhum item no carrinho.
          </div>
        `;

        totalResumo.textContent = "R$ 0,00";

        pedidoCount.textContent = "0 itens";

        return;
      }

      let total = 0;
      let totalItens = 0;

      carrinho.forEach(item => {

        const qtd =
          item.quantidade || 1;

        const subtotal =
          item.preco * qtd;

        total += subtotal;
        totalItens += qtd;

        const li =
          document.createElement("li");

        li.className = "item-carrinho";

        li.innerHTML = `

          <div class="item-info">

            <span class="item-nome">
              ${item.nome}
            </span>

            <span class="item-qtd">
              ${qtd}x item(s)
            </span>

          </div>

          <span class="item-preco">
            R$ ${subtotal.toFixed(2)}
          </span>

        `;

        lista.appendChild(li);

      });

      const tipoEntrega =
        document.getElementById("tipoEntrega").value;

      if(tipoEntrega === "entrega"){

        const local =
          document.getElementById("localEntrega").value;

        const valorEntrega =
          obterValorEntrega(local);

        if(valorEntrega > 0){

          total += valorEntrega;

          const entrega =
            document.createElement("div");

          entrega.className = "linha-entrega";

          entrega.innerHTML = `
            <span>📦 Taxa de entrega</span>
            <strong>
              R$ ${valorEntrega.toFixed(2)}
            </strong>
          `;

          lista.appendChild(entrega);
        }
      }

      pedidoCount.textContent =
        `${totalItens} item(s)`;

      totalResumo.textContent =
        `R$ ${total.toFixed(2)}`;
    }

    exibirCarrinho();

    /* ================= GERAR MENSAGEM ================= */

 function gerarMensagemPedido(){

  const nome = document.getElementById("nomeCliente").value;
  const tipoEntrega = document.getElementById("tipoEntrega").value;
  const localEntrega = document.getElementById("localEntrega").value;
  const endereco = document.getElementById("endereco").value;
  const observacao = document.getElementById("observacao").value;
  const pagamento = document.getElementById("pagamentoSelect").value;

  let mensagem = `🍔 *NOVO PEDIDO - PUMBAS BURGUER*\n\n`;

  if(nome){
    mensagem += `👤 Nome: ${nome}\n`;
  }

  mensagem += `\n📋 *ITENS:*\n`;

  let total = 0;

  carrinho.forEach(item => {

    const qtd = item.quantidade || 1;
    const subtotal = item.preco * qtd;

    total += subtotal;

    mensagem += `• ${item.nome} (${qtd}x) - R$ ${subtotal.toFixed(2)}\n`;
  });

  if(tipoEntrega === "entrega"){

    const taxa = obterValorEntrega(localEntrega);

    total += taxa;

    mensagem += `\n📦 Entrega: Sim\n`;
    mensagem += `📍 Região: ${localEntrega}\n`;

    if(endereco){
      mensagem += `🏠 Endereço: ${endereco}\n`;
    }

    if(taxa > 0){
      mensagem += `🚚 Taxa: R$ ${taxa.toFixed(2)}\n`;
    }

  } else {

    mensagem += `\n📦 Retirada no local\n`;
  }

  mensagem += `\n💳 Pagamento: ${pagamento}\n`;

  if(observacao){
    mensagem += `\n📝 Observação: ${observacao}\n`;
  }

  mensagem += `\n💰 *TOTAL: R$ ${total.toFixed(2)}*`;

  return mensagem;
}
    /* ================= ENVIAR WHATS ================= */

   document
  .getElementById("btnEnviarWhats")
  .addEventListener("click", () => {

    if (carrinho.length === 0) {

      alert("Seu carrinho está vazio.");

      return;
    }

    const mensagem = gerarMensagemPedido();

    const url =
      `https://wa.me/${whatsNumber}?text=${encodeURIComponent(mensagem)}`;

    // Abre o WhatsApp
    window.open(url, "_blank");

    // Limpa o carrinho
    carrinho = [];
    localStorage.removeItem("carrinho");

    // Tela de sucesso
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#111;
        color:#fff;
        text-align:center;
        padding:20px;
        font-family:Poppins,sans-serif;
      ">
        <div>

          <h1 style="
            font-size:42px;
            margin-bottom:20px;
          ">
            ✅ Pedido Enviado!
          </h1>

          <p style="
            font-size:22px;
            margin-bottom:15px;
          ">
            Obrigado por escolher a Pumbas Burguer!
          </p>

          <p style="margin-bottom:10px;">
            Seu pedido foi enviado com sucesso para nosso WhatsApp.
          </p>

          <p style="margin-bottom:10px;">
            Todo o atendimento e acompanhamento serão realizados por lá.
          </p>

          <p style="
            margin-top:25px;
            font-size:18px;
          ">
            🍔 Estamos preparando tudo com muito carinho para você.
          </p>

          <button
            onclick="location.href='index.html'"
            style="
              margin-top:30px;
              padding:12px 25px;
              border:none;
              border-radius:10px;
              cursor:pointer;
              font-size:16px;
              font-weight:bold;
            "
          >
            Fazer Novo Pedido
          </button>

        </div>
      </div>
    `;
  });
  </script>

</body>
</html>
